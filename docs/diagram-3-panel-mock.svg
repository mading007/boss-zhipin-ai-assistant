  <text x="64" y="453" font-size="11" fill="#555555"><tspan font-weight="600">HR 在线</tspan> — 平台机制：HR 离线时招呼语不会推送，只能躺后台等他上线</text>

  <circle cx="52" cy="470" r="4" fill="#dc3545"/>
  <text x="64" y="474" font-size="11" fill="#555555"><tspan font-weight="600">⚠ 匿名/猎头</tspan> — 公司名被平台匿名化，多为代招，投了不知去向，排序自动降权</text>

  <circle cx="52" cy="491" r="4" fill="#3498db"/>
  <text x="64" y="495" font-size="11" fill="#555555"><tspan font-weight="600">方向分</tspan> — 命中岗位加分词 +2/个，命中排除词 −4/个，正数越多越对口</text>

  <text x="40" y="524" font-size="10.5" fill="#a0a0a5">发送动作始终由使用者手动完成；「一键投递」只做两件事：复制话术、打开岗位页。</text>
